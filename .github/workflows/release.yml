name: Release patches

# Пуш тега v* собирает релиз с патчами этого репозитория.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish the patches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="Патчи поверх исходников [Forkop](https://github.com/ushan0v/forkop).
          Накладываются \`git apply\` или \`patch -p1\` на нужный тег, порядок: сначала 0001, затем 0002."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- *.patch
            echo "Release $TAG updated"
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes" -- *.patch
            echo "Release $TAG created"
          fi
